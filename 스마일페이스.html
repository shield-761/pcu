<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>예제 2: 스마일 페이스</title>
</head>

<body>
    <canvas id="myCanvas" width="400" height="400" style="background: #f0f0f0;"></canvas>

</body>
<script>
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");

    ctx.beginPath();
    ctx.arc(200,200,100,0,Math.PI*2);
    ctx.fillStyle = "gold";
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = "orange";
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(160,170,12,0,Math.PI*2);
    ctx.arc(240,170,12,0,Math.PI*2);
    ctx.fillStyle = "black";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(200,200,50,0,Math.PI);
    ctx.lineWidth = 5;
    ctx.strokeStyle = "black";
    ctx.stroke();
    

</script>

</html>
