<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Snake 게임</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        .game-container {
            position: relative;
            display: inline-block;
        }

        canvas {
            border: 2px solid black;
            background: #f9f9f9;
            display: block;
        }

        .difficulty-buttons {
            margin: 10px;
        }

        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            margin: 0 5px;
        }

        button.active {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
        }

        /* 게임 오버/승리 오버레이 스타일 */
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        #gameOverScreen h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        #gameOverScreen p {
            font-size: 20px;
            margin-bottom: 20px;
        }

        #restartBtn {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #ff5722;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        #restartBtn:hover {
            background-color: #e64a19;
        }
    </style>
</head>

<body>

    <h1>Snake 게임</h1>
    <p>점수: <span id="score">0</span> / 30점 목표 | 현재 난이도: <span id="difficultyText">2단계 (보통)</span></p>

    <div class="difficulty-buttons">
        <button id="btn1" onclick="setDifficulty(1, 180)">1단계 (쉬움)</button>
        <button id="btn2" class="active" onclick="setDifficulty(2, 120)">2단계 (보통)</button>
        <button id="btn3" onclick="setDifficulty(3, 80)">3단계 (어려움)</button>
    </div>

    <p>조작: 방향키 ↑ ↓ ← →</p>

    <!-- 게임 화면 컨테이너 -->
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <!-- 게임 오버/승리 시 나타나는 화면 -->
        <div id="gameOverScreen">
            <h2 id="resultTitle">게임 오버!</h2>
            <p id="resultScore">점수 : 0</p>
            <button id="restartBtn" onclick="restartGame()">다시 시작하기</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreText = document.getElementById("score");
        const difficultyText = document.getElementById("difficultyText");
        const gameOverScreen = document.getElementById("gameOverScreen");
        const resultTitle = document.getElementById("resultTitle");
        const resultScore = document.getElementById("resultScore");

        let score = 0;

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let food = {x: 5, y: 5, type: "red"};
        let bombs = [];

        let dx = 1; 
        let dy = 0; 
        let nextDx = 1;
        let nextDy = 0;

        let gameOver = false;
        let isInvincible = false;

        // localStorage에서 이전 난이도 불러오기 (없으면 기본값 2단계)
        let currentLevel = localStorage.getItem("snake_level") ? parseInt(localStorage.getItem("snake_level")) : 2;
        let gameSpeed = localStorage.getItem("snake_speed") ? parseInt(localStorage.getItem("snake_speed")) : 120;
        let gameInterval = null;

        function initDifficultyUI() {
            document.getElementById("btn1").classList.remove("active");
            document.getElementById("btn2").classList.remove("active");
            document.getElementById("btn3").classList.remove("active");
            document.getElementById("btn" + currentLevel).classList.add("active");

            if (currentLevel === 1) difficultyText.textContent = "1단계 (쉬움)";
            else if (currentLevel === 2) difficultyText.textContent = "2단계 (보통)";
            else if (currentLevel === 3) difficultyText.textContent = "3단계 (어려움)";
        }

        function setDifficulty(level, speed) {
            currentLevel = level;
            gameSpeed = speed;

            localStorage.setItem("snake_level", level);
            localStorage.setItem("snake_speed", speed);

            initDifficultyUI();

            if (!gameOver) {
                clearInterval(gameInterval);
                gameInterval = setInterval(gameLoop, gameSpeed);
            }
        }

        function drawTile(x, y, color){
            ctx.fillStyle = color;
            ctx.fillRect(x * gridSize, y * gridSize, gridSize - 2, gridSize - 2);
        }

        function drawSnake(){
            for(let i = 0; i < snake.length; i++){
                if(i === 0){
                    drawTile(snake[i].x, snake[i].y, isInvincible ? "orange" : "green");
                }
                else{
                    drawTile(snake[i].x, snake[i].y, "limegreen");
                }
            }
        }

        function drawFood(){
            let color = "red";
            if (food.type === "gold") color = "gold";
            else if (food.type === "blue") color = "blue";
            else if (food.type === "green") color = "forestgreen";

            drawTile(food.x, food.y, color);
        }

        function drawBombs(){
            for(let i = 0; i < bombs.length; i++){
                drawTile(bombs[i].x, bombs[i].y, "black");
            }
        }

        document.addEventListener("keydown", changeDirection);

        function changeDirection(event){
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) {
                event.preventDefault();
            }

            if(event.key === "ArrowUp" && dy !== 1){
                nextDx = 0;
                nextDy = -1;
            }
            if(event.key === "ArrowDown" && dy !== -1){
                nextDx = 0;
                nextDy = 1;
            }
            if(event.key === "ArrowLeft" && dx !== 1){
                nextDx = -1;
                nextDy = 0;
            }
            if(event.key === "ArrowRight" && dx !== -1){
                nextDx = 1;
                nextDy = 0;
            }
        }

        function moveSnake(){
            dx = nextDx;
            dy = nextDy;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            if(head.x === food.x && head.y === food.y){
                let scoreIncrease = 1;

                if (food.type === "red") {
                    scoreIncrease = 1;
                    score += 1;
                } else if (food.type === "gold") {
                    scoreIncrease = 5;
                    score += 5;
                    triggerInvincible();
                } else if (food.type === "blue") {
                    scoreIncrease = 2;
                    score += 2;
                } else if (food.type === "green") {
                    if (score > 0) {
                        score = Math.max(0, score - 1);
                        if (snake.length > 1) {
                            snake.pop();
                        }
                    }
                }

                if (food.type !== "green") {
                    for (let i = 1; i < scoreIncrease; i++) {
                        const tail = { ...snake[snake.length - 1] };
                        snake.push(tail);
                    }
                }

                scoreText.textContent = score;

                if (score >= 30) {
                    winGame();
                    return;
                }

                moveFood();
            }
            else {
                snake.pop();
            }

            for(let i = 0; i < bombs.length; i++){
                if(head.x === bombs[i].x && head.y === bombs[i].y){
                    if (!isInvincible) {
                        endGame();
                    }
                }
            }
        }

        function moveFood(){
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            const rand = Math.random();
            if (rand < 0.6) {
                food.type = "red";
            } else if (rand < 0.75) {
                food.type = "blue";
            } else if (rand < 0.9) {
                food.type = "green";
            } else {
                food.type = "gold";
            }

            for(let i = 0; i < snake.length; i++){
                if(food.x === snake[i].x && food.y === snake[i].y){
                    moveFood();
                    break;
                }
            }
        }

        function updateBombs() {
            if (Math.random() < 0.05 && bombs.length < 3) {
                let newBomb = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                bombs.push(newBomb);
            }
        }

        function triggerInvincible() {
            isInvincible = true;
            setTimeout(() => {
                isInvincible = false;
            }, 5000);
        }

        function checkCollision(){
            const head = snake[0];
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount){
                if (!isInvincible) {
                    endGame();
                } else {
                    if (head.x < 0) head.x = tileCount - 1;
                    if (head.x >= tileCount) head.x = 0;
                    if (head.y < 0) head.y = tileCount - 1;
                    if (head.y >= tileCount) head.y = 0;
                }
            }

            for(let i = 1; i < snake.length; i++){
                if(head.x === snake[i].x && head.y === snake[i].y){
                    if (!isInvincible) {
                        endGame();
                    }
                }
            }
        }

        function endGame(){
            gameOver = true;
            clearInterval(gameInterval);

            resultTitle.textContent = "게임 오버!";
            resultTitle.style.color = "white";
            resultScore.textContent = "점수 : " + score;
            gameOverScreen.style.display = "flex";
        }

        function winGame(){
            gameOver = true;
            clearInterval(gameInterval);

            resultTitle.textContent = "게임 승리! (30점 달성)";
            resultTitle.style.color = "gold";
            resultScore.textContent = "최종 점수 : " + score;
            gameOverScreen.style.display = "flex";
        }

        // 게임 재시작 함수
        function restartGame() {
            gameOver = false;
            score = 0;
            scoreText.textContent = score;
            snake = [{x: 10, y: 10}];
            bombs = [];
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            isInvincible = false;

            gameOverScreen.style.display = "none";
            moveFood();

            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        function gameLoop(){
            if (gameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            updateBombs();
            moveSnake();
            if (gameOver) return;
            drawFood();
            drawBombs();
            drawSnake();
            checkCollision();
        }

        // 초기 실행 시 UI 반영 및 게임 루프 시작
        initDifficultyUI();
        moveFood();
        gameInterval = setInterval(gameLoop, gameSpeed);
    </script>

</body>

</html>
