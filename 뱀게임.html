<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Snake 게임</title>

    <style>
        /* 웹페이지 전체의 텍스트 정렬 및 기본 폰트 설정 */
        body {
            text-align: center;
            font-family: Arial;
        }

        /* [추가 기능] 게임 캔버스와 결과 오버레이 팝업을 겹쳐서 배치하기 위한 부모 컨테이너 */
        .game-container {
            position: relative;
            display: inline-block;
        }

        /* 게임이 그려지는 캔버스 영역 테두리 및 배경색 지정 */
        canvas {
            border: 2px solid black;
            background: #f9f9f9;
            display: block;
        }

        /* 난이도 버튼들이 배치되는 영역의 여백 설정 */
        .difficulty-buttons {
            margin: 10px;
        }

        /* 공통 버튼 크기 및 디자인 스타일 */
        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            margin: 0 5px;
        }

        /* [추가 기능] 현재 선택된 난이도 버튼을 시각적으로 강조하는 스타일 */
        button.active {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
        }

        /* [추가 기능] 게임 오버 또는 승리 시 화면 전체를 어둡게 덮는 오버레이 레이어 스타일 */
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7); /* 반투명 검은색 배경 */
            display: none; /* 평소에는 숨겨져 있음 */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* 결과 화면의 안내 제목 폰트 크기 및 여백 */
        #gameOverScreen h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        /* 결과 화면의 점수 표시 폰트 크기 및 여백 */
        #gameOverScreen p {
            font-size: 20px;
            margin-bottom: 20px;
        }

        /* [추가 기능] 다시 시작하기 버튼의 색상 및 디자인 */
        #restartBtn {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #ff5722;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 다시 시작하기 버튼에 마우스를 올렸을 때의 색상 변화 */
        #restartBtn:hover {
            background-color: #e64a19;
        }
    </style>
</head>

<body>

    <h1>Snake 게임</h1>
    <!-- [추가 기능] 목표 점수(30점)와 현재 난이도 단계를 실시간으로 보여주는 상단 텍스트 -->
    <p>점수: <span id="score">0</span> / 30점 목표 | 현재 난이도: <span id="difficultyText">2단계 (보통)</span></p>
    
    <!-- [추가 기능] 난이도 변경을 위한 버튼 그룹 (클릭 시 setDifficulty 함수 호출) -->
    <div class="difficulty-buttons">
        <button id="btn1" onclick="setDifficulty(1, 180)">1단계 (쉬움)</button>
        <button id="btn2" class="active" onclick="setDifficulty(2, 120)">2단계 (보통)</button>
        <button id="btn3" onclick="setDifficulty(3, 80)">3단계 (어려움)</button>
    </div>

    <p>조작: 방향키 ↑ ↓ ← →</p>

    <!-- 캔버스와 결과 팝업창을 함께 묶어주는 컨테이너 래퍼 -->
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <!-- [추가 기능] 게임이 끝났을 때 나타나는 결과창과 재시작 버튼 영역 -->
        <div id="gameOverScreen">
            <h2 id="resultTitle">게임 오버!</h2>
            <p id="resultScore">점수 : 0</p>
            <button id="restartBtn" onclick="restartGame()">다시 시작하기</button>
        </div>
    </div>

    <script>
        /* HTML 문서에서 캔버스 엘리먼트를 가져오고 2D 그래픽 렌더링 도구를 활성화 */
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        /* 점수, 난이도 텍스트, 결과 오버레이 DOM 요소를 자바스크립트 변수에 연결 */
        const scoreText = document.getElementById("score");
        const difficultyText = document.getElementById("difficultyText");
        const gameOverScreen = document.getElementById("gameOverScreen");
        const resultTitle = document.getElementById("resultTitle");
        const resultScore = document.getElementById("resultScore");

        let score = 0; // 플레이어의 현재 점수를 저장하는 변수

        const gridSize = 20; // 게임판 한 칸의 크기 (20x20 픽셀)
        const tileCount = canvas.width / gridSize; // 캔버스 전체를 몇 칸으로 나눌 것인지 계산 (총 20칸)

        let snake = [{x: 10, y: 10}]; // 뱀의 마디 좌표들을 담는 배열 (초기 머리 위치는 중앙인 x:10, y:10)
        let food = {x: 5, y: 5, type: "red"}; // 사과의 좌표와 종류(기본 빨강)를 담는 객체
        let bombs = []; // [추가 기능] 화면에 생성될 폭탄들의 좌표 객체들을 담을 배열

        let dx = 1; // 현재 X축 이동 방향 벡터 (1: 오른쪽, -1: 왼쪽, 0: 정지)
        let dy = 0; // 현재 Y축 이동 방향 벡터 (1: 아래, -1: 위, 0: 정지)
        let nextDx = 1; // 연타 시 방향 꼬임 방지를 위해 다음 프레임에 반영할 X 방향 미리 저장
        let nextDy = 0; // 연타 시 방향 꼬임 방지를 위해 다음 프레임에 반영할 Y 방향 미리 저장

        let gameOver = false; // 게임이 끝났는지 여부를 판별하는 플래그 변수
        let isInvincible = false; // [추가 기능] 황금 사과를 먹었을 때 적용되는 무적 상태 플래그

        /* [추가 기능] 엘리스 플랫폼 등에서 새로고침해도 선택한 난이도가 유지되도록 브라우저 저장소(localStorage) 활용 */
        let currentLevel = localStorage.getItem("snake_level") ? parseInt(localStorage.getItem("snake_level")) : 2;
        let gameSpeed = localStorage.getItem("snake_speed") ? parseInt(localStorage.getItem("snake_speed")) : 120;
        let gameInterval = null; // 게임 루프(setInterval) 타이머를 제어하기 위한 변수

        /* [추가 기능] 저장된 난이도 값에 맞춰 상단 버튼의 active 디자인과 안내 텍스트를 동적으로 갱신하는 함수 */
        function initDifficultyUI() {
            // 모든 난이도 버튼에서 active 클래스 제거
            document.getElementById("btn1").classList.remove("active");
            document.getElementById("btn2").classList.remove("active");
            document.getElementById("btn3").classList.remove("active");
            // 현재 레벨에 해당하는 버튼에만 active 클래스 추가
            document.getElementById("btn" + currentLevel).classList.add("active");

            // 상단 안내 글자 변경
            if (currentLevel === 1) difficultyText.textContent = "1단계 (쉬움)";
            else if (currentLevel === 2) difficultyText.textContent = "2단계 (보통)";
            else if (currentLevel === 3) difficultyText.textContent = "3단계 (어려움)";
        }

        /* [추가 기능] 난이도 버튼을 클릭했을 때 호출되어 속도를 바꾸고 로컬 스토리지에 저장하는 함수 */
        function setDifficulty(level, speed) {
            currentLevel = level;
            gameSpeed = speed;

            // 브라우저에 난이도와 속도 값을 영구적으로 기록
            localStorage.setItem("snake_level", level);
            localStorage.setItem("snake_speed", speed);

            initDifficultyUI(); // UI 업데이트

            // 게임이 진행 중인 도중에 난이도를 바꾸면 즉시 타이머 속도를 변경하여 반영
            if (!gameOver) {
                clearInterval(gameInterval);
                gameInterval = setInterval(gameLoop, gameSpeed);
            }
        }

        /* 캔버스 좌표(x, y)에 특정 색상의 사각형 블록(타일) 한 개를 그려주는 기본 유틸리티 함수 */
        function drawTile(x, y, color){
            ctx.fillStyle = color;
            // 칸과 칸 사이에 미세한 간격(-2px)을 주어 격자 형태가 예쁘게 보이도록 함
            ctx.fillRect(x * gridSize, y * gridSize, gridSize - 2, gridSize - 2);
        }

        /* 뱀 배열을 순회하며 전체 몸통을 캔버스에 그려주는 함수 ([추가 기능] 무적 상태일 때 머리는 주황색으로 표시) */
        function drawSnake(){
            for(let i = 0; i < snake.length; i++){
                if(i === 0){
                    // 인덱스 0번째는 뱀의 머리
                    drawTile(snake[i].x, snake[i].y, isInvincible ? "orange" : "green");
                }
                else{
                    // 인덱스 1 이상은 뱀의 몸통
                    drawTile(snake[i].x, snake[i].y, "limegreen");
                }
            }
        }

        /* [추가 기능] 사과의 종류(red, gold, blue, green)에 따라 각각 알맞은 색상으로 변환하여 그려주는 함수 */
        function drawFood(){
            let color = "red"; // 기본값 빨강
            if (food.type === "gold") color = "gold";             // 황금 사과 (무적)
            else if (food.type === "blue") color = "blue";         // 파란 사과 (점수 2배)
            else if (food.type === "green") color = "forestgreen"; // 초록 사과 (점수 차감)

            drawTile(food.x, food.y, color);
        }

        /* [추가 기능] 폭탄 배열에 들어있는 모든 폭탄 위치에 검은색 블록을 그려주는 함수 */
        function drawBombs(){
            for(let i = 0; i < bombs.length; i++){
                drawTile(bombs[i].x, bombs[i].y, "black");
            }
        }

        /* 키보드가 눌렸을 때 발생하는 이벤트를 감지하여 방향 전환 함수와 연결 */
        document.addEventListener("keydown", changeDirection);

        /* 방향키 입력 시 뱀의 진행 방향을 안전하게 제어하는 함수 (반대 방향 역주행 방지 포함) */
        function changeDirection(event){
            // 화살표 키나 스페이스바를 누를 때 웹페이지 전체 화면이 위아래로 움직이는 기본 브라우저 스크롤 현상 차단
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) {
                event.preventDefault();
            }

            // 위쪽 방향키 입력 (현재 아래쪽으로 이동 중이 아닐 때만 허용)
            if(event.key === "ArrowUp" && dy !== 1){
                nextDx = 0;
                nextDy = -1;
            }
            // 아래쪽 방향키 입력 (현재 위쪽으로 이동 중이 아닐 때만 허용)
            if(event.key === "ArrowDown" && dy !== -1){
                nextDx = 0;
                nextDy = 1;
            }
            // 왼쪽 방향키 입력 (현재 오른쪽으로 이동 중이 아닐 때만 허용)
            if(event.key === "ArrowLeft" && dx !== 1){
                nextDx = -1;
                nextDy = 0;
            }
            // 오른쪽 방향키 입력 (현재 왼쪽으로 이동 중이 아닐 때만 허용)
            if(event.key === "ArrowRight" && dx !== -1){
                nextDx = 1;
                nextDy = 0;
            }
        }

        /* 매 프레임마다 뱀의 위치를 한 칸씩 이동시키고 사과 섭취 및 점수/길이를 연동하는 핵심 로직 함수 */
        function moveSnake(){
            dx = nextDx;
            dy = nextDy;

            // 다음 위치할 머리 좌표 계산 후 뱀 배열의 맨 앞에 추가 (unshift)
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            // 뱀의 머리 좌표가 사과 좌표와 정확히 일치하는지 검사 (사과를 먹었을 때)
            if(head.x === food.x && head.y === food.y){
                let scoreIncrease = 1; // 기본 점수 증가 폭

                /* [추가 기능] 사과 종류별로 점수 가감 및 특수 효과 분기 처리 */
                if (food.type === "red") {
                    scoreIncrease = 1;
                    score += 1;
                } else if (food.type === "gold") {
                    scoreIncrease = 5;
                    score += 5;
                    triggerInvincible(); // 5초 무적 모드 활성화
                } else if (food.type === "blue") {
                    scoreIncrease = 2;
                    score += 2;
                } else if (food.type === "green") {
                    // 초록 사과: 점수 차감 및 꼬리 축소 (단, 점수가 0보다 클 때만 작동)
                    if (score > 0) {
                        score = Math.max(0, score - 1);
                        if (snake.length > 1) {
                            snake.pop(); // 꼬리 마디를 하나 제거하여 길이 단축
                        }
                    }
                }

                /* [추가 기능] 초록 사과가 아닐 경우, 획득한 점수 크기만큼 뱀의 몸통 길이를 추가 연장 */
                if (food.type !== "green") {
                    for (let i = 1; i < scoreIncrease; i++) {
                        const tail = { ...snake[snake.length - 1] };
                        snake.push(tail); // 마지막 꼬리 위치를 복제하여 길이를 늘림
                    }
                }

                scoreText.textContent = score; // 상단 점수판 텍스트 갱신

                /* [추가 기능] 목표 점수인 30점에 도달했는지 확인하고 도달 시 승리 처리 후 종료 */
                if (score >= 30) {
                    winGame();
                    return;
                }

                moveFood(); // 먹힌 자리에 새로운 사과 재생성
            }
            else {
                // 사과를 먹지 않았을 때는 일반 이동이므로, 전진함에 따라 마지막 꼬리 칸을 제거하여 길이 유지
                snake.pop();
            }

            /* [추가 기능] 뱀 머리가 폭탄의 위치와 닿았는지 검사 (무적 상태가 아닐 때만 게임 오버 판정) */
            for(let i = 0; i < bombs.length; i++){
                if(head.x === bombs[i].x && head.y === bombs[i].y){
                    if (!isInvincible) {
                        endGame();
                    }
                }
            }
        }

        /* [추가 기능] 확률적 가중치를 계산하여 빨강, 파랑, 초록, 황금 사과 중 하나를 무작위로 생성하는 함수 */
        function moveFood(){
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            const rand = Math.random(); // 0.0 ~ 1.0 사이의 무작위 실수 생성
            if (rand < 0.6) {
                food.type = "red";    // 60% 확률: 일반 빨간 사과
            } else if (rand < 0.75) {
                food.type = "blue";   // 15% 확률: 파란 사과 (점수 2배)
            } else if (rand < 0.9) {
                food.type = "green";  // 15% 확률: 초록 사과 (점수 차감)
            } else {
                food.type = "gold";   // 10% 확률: 황금 사과 (무적)
            }

            // 사과가 하필 현재 뱀의 몸통 위에 생성되었다면 겹치지 않도록 사과 위치를 다시 뽑기
            for(let i = 0; i < snake.length; i++){
                if(food.x === snake[i].x && food.y === snake[i].y){
                    moveFood();
                    break;
                }
            }
        }

        /* [추가 기능] 게임 플레이 중 일정 확률로 화면 상에 새로운 폭탄 블록을 추가하는 함수 (최대 3개 유지) */
        function updateBombs() {
            if (Math.random() < 0.05 && bombs.length < 3) {
                let newBomb = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                bombs.push(newBomb);
            }
        }

        /* [추가 기능] 황금 사과를 먹었을 때 5초(5000ms) 동안 무적 상태를 켜고 끄는 타이머 함수 */
        function triggerInvincible() {
            isInvincible = true;
            setTimeout(() => {
                isInvincible = false; // 5초 뒤 무적 해제
            }, 5000);
        }

        /* 뱀이 벽에 부딪히거나 자기 몸통에 닿았는지 충돌을 검사하는 함수 */
        function checkCollision(){
            const head = snake[0];
            
            // 캔버스 벽 바깥으로 나갔는지 검사 ([추가 기능] 무적 상태일 때는 벽을 통과하여 반대편으로 튀어나옴)
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount){
                if (!isInvincible) {
                    endGame();
                } else {
                    // 반대편 위치로 좌표를 순간 이동(텔레포트)시켜 주는 랩어라운드 처리
                    if (head.x < 0) head.x = tileCount - 1;
                    if (head.x >= tileCount) head.x = 0;
                    if (head.y < 0) head.y = tileCount - 1;
                    if (head.y >= tileCount) head.y = 0;
                }
            }

            // 뱀의 머리(0번)가 자신의 몸통 마디들(1번부터 끝까지)과 겹치는지 순회하며 검사
            for(let i = 1; i < snake.length; i++){
                if(head.x === snake[i].x && head.y === snake[i].y){
                    if (!isInvincible) {
                        endGame(); // 무적이 아닐 때만 게임 오버 처리
                    }
                }
            }
        }

        /* [추가 기능] 게임 오버 상황 발생 시 타이머를 정지하고 결과 오버레이 팝업을 띄우는 함수 */
        function endGame(){
            gameOver = true;
            clearInterval(gameInterval); // 게임 반복 루프 일시 중지

            resultTitle.textContent = "게임 오버!";
            resultTitle.style.color = "white";
            resultScore.textContent = "점수 : " + score;
            gameOverScreen.style.display = "flex"; // 결과 화면 표시
        }

        /* [추가 기능] 30점 목표를 달성하여 게임을 클리어했을 때 축하 승리 팝업을 띄우는 함수 */
        function winGame(){
            gameOver = true;
            clearInterval(gameInterval); // 게임 반복 루프 일시 중지

            resultTitle.textContent = "게임 승리! (30점 달성)";
            resultTitle.style.color = "gold";
            resultScore.textContent = "최종 점수 : " + score;
            gameOverScreen.style.display = "flex"; // 승리 화면 표시
        }

        /* [추가 기능] 게임 오버/승리 화면에서 '다시 시작하기' 버튼을 눌렀을 때 모든 변수를 초기화하고 재시작하는 함수 */
        function restartGame() {
            gameOver = false;
            score = 0;
            scoreText.textContent = score;
            snake = [{x: 10, y: 10}]; // 뱀 초기 위치로 리셋
            bombs = []; // 폭탄 목록 초기화
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            isInvincible = false;

            gameOverScreen.style.display = "none"; // 결과 오버레이 숨기기
            moveFood(); // 사과 새로 배치

            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed); // 현재 설정된 난이도 속도로 게임 루프 재가동
        }

        /* 일정한 시간 간격(속도)마다 반복 실행되며 화면을 갱신하는 메인 게임 루프 함수 */
        function gameLoop(){
            if (gameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height); // 이전 프레임의 잔상을 지우기 위해 캔버스 전체 초기화

            updateBombs();    // [추가 기능] 폭탄 생성 및 관리 로직 실행
            moveSnake();      // 뱀 이동 및 아이템 충돌 판정 실행
            if (gameOver) return; // 중간에 게임 오버나 승리가 발생했다면 렌더링 중단
            drawFood();       // 사과 그리기
            drawBombs();      // [추가 기능] 폭탄 그리기
            drawSnake();      // 뱀 그리기
            checkCollision(); // 벽 및 몸통 충돌 검사
        }

        // 스크립트 파일이 처음 실행될 때: 난이도 UI 반영, 첫 번째 사과 생성, 게임 루프 타이머 시작
        initDifficultyUI();
        moveFood();
        gameInterval = setInterval(gameLoop, gameSpeed);
    </script>

</body>

</html>
