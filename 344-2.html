<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>[]로 배열 만들기</title>
</head>
<body>

<h3>정수 5개 입력받아 역순으로 출력</h3>
<hr>

<script>
    let plots = []; 

   
    for(let i=0; i<5; i++) {
        let input = prompt("정수를 입력하세요");
        plots[i] = parseInt(input);
    }
    document.write("입력된 수의 배열 : ");
    for(let i=0; i<5; i++) {
        document.write(plots[i] + " ");
    }
    
    document.write("<br><hr>");

    document.write("역순으로 재정렬된 배열 : ");
    for(let i=4; i>=0; i--) {
        document.write(plots[i] + " ");
    }
</script>

</body>
</html>
